<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-problem"
        class="scene"
        data-composition-id="02-problem"
        data-composition-src="compositions/frames/02-problem.html"
        data-start="8"
        data-duration="8"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-problem-voice"
        src="assets/voice/02.wav"
        data-start="8"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-3d-hero"
        class="scene"
        data-composition-id="03-3d-hero"
        data-composition-src="compositions/frames/03-3d-hero.html"
        data-start="16"
        data-duration="12"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-3d-hero-voice"
        src="assets/voice/03.wav"
        data-start="16"
        data-duration="12"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-gallery"
        class="scene"
        data-composition-id="04-gallery"
        data-composition-src="compositions/frames/04-gallery.html"
        data-start="28"
        data-duration="20"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-gallery-voice"
        src="assets/voice/04.wav"
        data-start="28"
        data-duration="20"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-named"
        class="scene"
        data-composition-id="05-named"
        data-composition-src="compositions/frames/05-named.html"
        data-start="48"
        data-duration="12"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-named-voice"
        src="assets/voice/05.wav"
        data-start="48"
        data-duration="12"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-editorial"
        class="scene"
        data-composition-id="06-editorial"
        data-composition-src="compositions/frames/06-editorial.html"
        data-start="60"
        data-duration="10"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-editorial-voice"
        src="assets/voice/06.wav"
        data-start="60"
        data-duration="10"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-07-community"
        class="scene"
        data-composition-id="07-community"
        data-composition-src="compositions/frames/07-community.html"
        data-start="70"
        data-duration="10"
        data-track-index="1"
      ></div>
      <audio
        id="el-07-community-voice"
        src="assets/voice/07.wav"

      ></audio>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="80"

        data-track-index="1"
      ></div>
      <audio
        id="el-08-cta-voice"
        src="assets/voice/08.wav"
        data-start="80"
        data-duration="10"
        data-track-index="10"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
