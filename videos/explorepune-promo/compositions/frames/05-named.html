<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
                #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          color: #fcfaf4;
        }
        .bg {
          position: absolute;
          inset: 0;
          background: #181615;
        }
        .col {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 640px;
          overflow: hidden;
        }
        .col img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 120%;
          object-fit: cover;
        }
        .col .cap {
          position: absolute;
          left: 28px;
          right: 28px;
          bottom: 48px;
          font-family: "EB Garamond", Georgia, serif;
          font-size: 40px;
          font-weight: 700;
          text-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
        }
      </style>
      <div id="root" data-composition-id="05-named" data-width="1920" data-height="1080">
        <div class="bg"></div>
        <div class="col" id="col-a" style="left: 0">
          <img id="img-a" src="assets/3d/sinhagad-fort.png" alt="3D Sinhagad Fort" />
          <div class="cap">Sinhagad</div>
        </div>
        <div class="col" id="col-b" style="left: 640px">
          <img id="img-b" src="assets/3d/pataleshwar-cave-temple.png" alt="3D Pataleshwar Cave" />
          <div class="cap">Pataleshwar</div>
        </div>
        <div class="col" id="col-c" style="left: 1280px">
          <img id="img-c" src="assets/3d/national-war-memorial.png" alt="3D National War Memorial" />
          <div class="cap">Ghorpadi</div>
        </div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#img-a", { y: 0 }, { y: -40, duration: 12, ease: "none" }, 0);
        tl.fromTo("#img-b", { y: -20 }, { y: 10, duration: 12, ease: "none" }, 0);
        tl.fromTo("#img-c", { y: 0 }, { y: -36, duration: 12, ease: "none" }, 0);
        tl.fromTo("#col-a", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
        tl.fromTo("#col-b", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.35);
        tl.fromTo("#col-c", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.6);
        window.__timelines["05-named"] = tl;
      </script>
    </template>
  </body>
</html>
